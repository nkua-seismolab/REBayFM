[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "REBayFM"
version = "1.0.0"
description = "SeisComP-dependent near real-time Bayesian focal mechanism estimation from first-motion polarities and shear-wave polarizations."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Ioannis Spingos", email = "ispingos@geol.uoa.gr" },
    { name = "Vasilis Kapetanidis", email = "vkapetan@geol.uoa.gr"},
    { name = "Angelos Zymvragakis", email = "azymvragakis@geol.uoa.gr" },
    { name = "George Kaviris", email = "gkaviris@geol.uoa.gr"}
]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/nkua-seismolab/REBayFM"
Issues = "https://github.com/nkua-seismolab/REBayFM/issues"

[tool.setuptools.dynamic]
dependencies = {file = ["rebayfm/requirements.txt"]}

[project.scripts]
rebayfm = "rebayfm.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rebayfm*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["velocity_models", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern syntax)
]

[tool.ruff.lint.isort]
known-first-party = ["rebayfm"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
